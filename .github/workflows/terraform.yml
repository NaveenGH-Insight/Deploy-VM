name: Terraform deployment

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  push:
    branches:
      - main
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Format and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  deploy:
    name: Plan and apply
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra
    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_admin_password: ${{ secrets.VM_ADMIN_PASSWORD }}
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Check Windows 11 image availability
        env:
          IMAGE_PUBLISHER: MicrosoftWindowsDesktop
          IMAGE_OFFER: Windows-11
          IMAGE_SKU: ${{ vars.WINDOWS_IMAGE_SKU || 'win11-25h2-ent' }}
          AZURE_LOCATION: eastus
        run: |
          az vm image show \
            --location "$AZURE_LOCATION" \
            --urn "$IMAGE_PUBLISHER:$IMAGE_OFFER:$IMAGE_SKU:latest" \
            --output none
      - name: Initialize remote state
        env:
          STATE_RESOURCE_GROUP: ${{ vars.TF_STATE_RESOURCE_GROUP }}
          STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
          STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER }}
          STATE_KEY: ${{ vars.TF_STATE_KEY }}
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=$STATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$STATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$STATE_CONTAINER" \
            -backend-config="key=$STATE_KEY" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true"
      - name: Plan
        run: terraform plan -input=false -out=tfplan
      - name: Apply saved plan
        run: terraform apply -input=false -auto-approve tfplan
